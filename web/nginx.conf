server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File referensi Master Data (mis. export SAP-COOISPI) bisa berukuran
    # ratusan MB / jutaan baris -- default nginx (1MB body, 60s timeout)
    # akan memotong upload itu kalau tidak dinaikkan.
    client_max_body_size 520M;

    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri /index.html;
    }
}
